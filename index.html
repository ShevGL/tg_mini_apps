<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1b2a41" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Погода в Алматы</title>
<style>
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.22; }
  main { position: relative; z-index: 1; max-width: 420px; margin: 0 auto; }
  * { box-sizing: border-box; image-rendering: pixelated; }
  html, body { min-height: 100dvh; }
  body {
    font-family: "Courier New", ui-monospace, monospace;
    margin: 0;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
    font-size: 15px; line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  h3 {
    font-size: 18px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 1px;
    border-bottom: 2px solid var(--tg-theme-text-color, #000); padding-bottom: 6px;
  }
  p { margin: 8px 0; padding: 8px 10px; border: 2px solid var(--tg-theme-hint-color, #888); }
  #weather { font-size: 18px; font-weight: bold; border-color: var(--tg-theme-text-color, #000); }
  #outfit { border-style: dashed; }
  .muted { font-size: 12px; border: none; padding: 0; opacity: .7; }
  button {
    font-family: inherit; text-transform: uppercase; letter-spacing: 1px;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #fff);
    border: 2px solid var(--tg-theme-text-color, #000);
    border-radius: 0; padding: 12px 16px; font-size: 14px; width: 100%;
    box-shadow: 4px 4px 0 var(--tg-theme-text-color, #000);
    margin-top: 12px; cursor: pointer;
  }
  button:active, button[disabled] { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--tg-theme-text-color, #000); }
  button[disabled] { opacity: .7; }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main>
  <h3>Погода в Алматы</h3>
  <p id="weather">Загрузка погоды…</p>
  <p id="air">Загрузка качества воздуха…</p>
  <p id="outfit">—</p>
  <p id="status" class="muted">Telegram…</p>
  <p id="updated" class="muted">Ещё не обновлялось</p>
  <button id="refresh" type="button">Обновить</button>
  <button id="play" type="button">Сыграть</button>
</main>
<script>
(function () {
  "use strict";

  const LAT = 43.25, LON = 76.95, TZ = "Asia/Almaty";

  const WMO = {
    0: "ясно", 1: "в основном ясно", 2: "переменная облачность", 3: "пасмурно",
    45: "туман", 48: "изморозь", 51: "морось", 53: "морось", 55: "сильная морось",
    56: "ледяная морось", 57: "ледяная морось",
    61: "небольшой дождь", 63: "дождь", 65: "сильный дождь",
    66: "ледяной дождь", 67: "ледяной дождь",
    71: "снег", 73: "снег", 75: "сильный снег", 77: "снежная крупа",
    80: "ливень", 81: "ливень", 82: "сильный ливень", 85: "снегопад", 86: "снегопад",
    95: "гроза", 96: "гроза с градом", 99: "гроза с градом"
  };
  const RAIN = [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99];

  const $ = (id) => document.getElementById(id);

  function withTimeout(url, ms) {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), ms || 8000);
    return fetch(url, { signal: c.signal, cache: "no-store" }).finally(() => clearTimeout(t));
  }

  function outfitAdvice(feels, wind, code) {
    let a;
    if (feels <= -15) a = "Тёплая зимняя куртка, шапка, перчатки, шарф.";
    else if (feels <= -10) a = "Пуховик, шапка, перчатки, шарф.";
    else if (feels <= 0) a = "Зимняя куртка, шапка и перчатки.";
    else if (feels <= 8) a = "Тёплая куртка, шарф, закрытая обувь.";
    else if (feels <= 15) a = "Лёгкая куртка или свитер.";
    else if (feels <= 22) a = "Футболка и лёгкая кофта на вечер.";
    else a = "Лёгкая одежда, не забыть воду.";
    if (RAIN.indexOf(code) >= 0 || code >= 71 && code <= 77) a += " Возьмите зонт.";
    if (wind >= 10) a += " Ветрено, ветровка не помешает.";
    return "Одежда: " + a;
  }

  function aqiLabel(v) {
    if (v == null || isNaN(v)) return "нет данных";
    if (v <= 50) return "хороший";
    if (v <= 100) return "умеренный";
    if (v <= 150) return "вредный для чувствительных";
    if (v <= 200) return "вредный";
    return "очень вредный";
  }

  function loadWeather() {
    $("weather").textContent = "Загрузка погоды…";
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,precipitation" +
      "&wind_speed_unit=ms&timezone=" + encodeURIComponent(TZ);
    return withTimeout(url, 8000)
      .then((r) => { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then((d) => {
        const c = d.current;
        const t = Math.round(c.temperature_2m);
        const feels = Math.round(c.apparent_temperature);
        const wind = c.wind_speed_10m;
        $("weather").textContent = t + "°C, " + (WMO[c.weather_code] || "погода") +
          ", ветер " + wind.toFixed(1) + " м/с · ощущается как " + feels + "°";
        $("outfit").textContent = outfitAdvice(feels, wind, c.weather_code);
        setFx(c.weather_code);
        return c;
      })
      .catch(() => { $("weather").textContent = "Не удалось загрузить погоду"; return null; });
  }

  function loadAir() {
    $("air").textContent = "Загрузка качества воздуха…";
    const url = "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=" + LAT + "&longitude=" + LON +
      "&current=us_aqi,pm2_5,pm10&timezone=" + encodeURIComponent(TZ);
    return withTimeout(url, 8000)
      .then((r) => { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then((d) => {
        const c = d.current || {};
        const aqi = c.us_aqi == null ? NaN : Math.round(c.us_aqi);
        const parts = [];
        if (!isNaN(aqi)) parts.push("AQI " + aqi + " (" + aqiLabel(aqi) + ")");
        if (c.pm2_5 != null) parts.push("PM2.5 " + Math.round(c.pm2_5) + " мкг/м³");
        if (c.pm10 != null) parts.push("PM10 " + Math.round(c.pm10) + " мкг/м³");
        $("air").textContent = parts.length ? "Воздух: " + parts.join(", ") : "Качество воздуха: нет данных";
      })
      .catch(() => { $("air").textContent = "Качество воздуха недоступно (погода выше между тем актуальна)"; });
  }

  function refreshAll() {
    const btn = $("refresh");
    btn.disabled = true;
    btn.textContent = "Обновляю…";
    Promise.allSettled([loadWeather(), loadAir()]).then(() => {
      const t = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", timeZone: TZ });
      $("updated").textContent = "Обновлено в " + t + " (Алматы)";
      btn.disabled = false;
      btn.textContent = "Обновить";
    });
  }

  $("refresh").addEventListener("click", refreshAll);
  $("play").addEventListener("click", () => { location.href = "shake.html"; });

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    const name = tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name;
    $("status").textContent = "Тема: " + tg.colorScheme + " · пользователь: " + (name || "неизвестно");
  } else {
    $("status").textContent = "Открыто вне Telegram";
  }

  refreshAll();

  // Фон: тихие пиксельные погодные элементы
  const canvas = $("fx"), ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let particles = [], kind = "stars";

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  function spawn(anywhere) {
    const w = innerWidth, h = innerHeight;
    const size = kind === "clouds" ? 16 : 3;
    return {
      x: Math.random() * w,
      y: anywhere ? Math.random() * h : -10,
      s: size,
      v: kind === "rain" ? 6 + Math.random() * 4 : kind === "snow" ? 0.6 + Math.random() * 0.6 : kind === "clouds" ? 0.15 : 0.02,
      drift: kind === "snow" ? Math.random() - 0.5 : 0,
      tw: Math.random() * Math.PI * 2
    };
  }

  function setFx(code) {
    if (code >= 71 && code <= 77 || code === 85 || code === 86) kind = "snow";
    else if (RAIN.indexOf(code) >= 0) kind = "rain";
    else if (code >= 2) kind = "clouds";
    else kind = "stars";
    particles = [];
    const count = kind === "clouds" ? 6 : 28;
    for (let i = 0; i < count; i++) particles.push(spawn(true));
    if (reduceMotion) draw();
  }

  function drawPixel(x, y, size) { ctx.fillRect(Math.round(x), Math.round(y), size, size); }
  function drawCloud(x, y) {
    const blocks = [[1,0],[2,0],[0,1],[1,1],[2,1],[3,1],[4,1],[1,2],[2,2],[3,2],[4,2],[5,2]];
    for (let i = 0; i < blocks.length; i++) drawPixel(x + blocks[i][0] * 4, y + blocks[i][1] * 4, 4);
  }

  function draw() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.fillStyle = getComputedStyle(document.body).color;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (kind === "stars") {
        p.tw += 0.03;
        if (Math.sin(p.tw) > 0) drawPixel(p.x, p.y, p.s);
      } else if (kind === "clouds") drawCloud(p.x, p.y);
      else drawPixel(p.x, p.y, p.s);
    }
  }

  function tick() {
    draw();
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.y += p.v;
      p.x += p.drift * 0.5;
      if (kind === "clouds") p.x += p.v;
      if (p.y > innerHeight + 20) Object.assign(p, spawn(false));
      if (p.x > innerWidth + 40) p.x = -40;
    }
    requestAnimationFrame(tick);
  }

  setFx(0);
  if (!reduceMotion) tick();
})();
</script>
</body>
</html>
